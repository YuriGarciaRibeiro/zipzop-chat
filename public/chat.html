<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Zipzop Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }

        .chat-container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 400px;
            height: 500px;
            display: flex;
            flex-direction: column;
        }

        #messages {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
            padding: 10px;
        }

        #messageInput {
            padding: 10px;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div id="messages"></div>
        <input type="text" id="messageInput" placeholder="Type a message..." />
    </div>

    <script>
        // Verificar se o token JWT existe no localStorage
        const token = localStorage.getItem('token');

        if (!token) {
            // Se não houver token, redirecionar para a tela de login
            window.location.href = '/login';
        }

        // Conectar ao WebSocket
        const socket = new WebSocket('ws://localhost:8080/ws?token=' + token);

        // Quando a conexão WebSocket for aberta, enviar o token JWT
        socket.onopen = () => {
            socket.send(JSON.stringify({ type: 'authenticate', token }));
        };

        // Exibir mensagens recebidas no WebSocket
        socket.onmessage = (event) => {
            const message = JSON.parse(event.data);
            console.log(message);
            const messageElement = document.createElement('div');
            messageElement.textContent = `${message.sender}: ${message.content}`;
            document.getElementById('messages').appendChild(messageElement);
        };

        // Enviar mensagem quando o usuário pressionar Enter
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const messageContent = e.target.value;
                socket.send(JSON.stringify({ type: 'text', content: messageContent }));
                e.target.value = '';
            }
        });
    </script>
</body>

</html>
